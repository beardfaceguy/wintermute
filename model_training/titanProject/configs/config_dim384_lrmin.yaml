model:
  variant: mac
  vocab_size: 50000
  dim: 384
  depth: 5
  heads: 6
  ff_mult: 4
  segment_len: 256
  num_persist_mem_tokens: 4
  num_longterm_mem_tokens: 16

train:
  seq_len: 256
  batch_size: 12
  lr: 0.0005
  lr_min: 0.00005
  weight_decay: 0.01
  warmup_steps: 300
  max_steps: 5000          # override via CLI as needed
  grad_clip: 1.0
  betas: [0.9, 0.98]
  eps: 1.0e-8
  cosine_decay: true
  save_every: 1000
  eval_every: 500

data:
  train_path: model_training/LLM/data/tinystories_sampled/train_sample.txt
  val_path: model_training/LLM/data/tinystories_sampled/val_sample.txt
  tokenizer_path: model_training/LLM/tokenizers/bpe_50k_bf.model
  shuffle_buffer: 100000


