model:
  variant: mac
  vocab_size: 50000
  dim: 384
  depth: 5
  heads: 6
  ff_mult: 4
  segment_len: 512
  num_persist_mem_tokens: 0
  num_longterm_mem_tokens: 0

train:
  seq_len: 512
  batch_size: 6
  lr: 0.0001
  lr_min: 0.00002
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 600
  grad_clip: 1.0
  betas: [0.9, 0.98]
  eps: 1.0e-8
  cosine_decay: false
  save_every: 200
  eval_every: 100

data:
  train_path: model_training/LLM/data/sft_mix/train_sft_mix.txt
  val_path: model_training/LLM/data/sft_mix/val_sft_mix.txt
  tokenizer_path: model_training/LLM/tokenizers/bpe_50k_bf.model
  shuffle_buffer: 100000
