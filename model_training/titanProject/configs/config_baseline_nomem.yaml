model:
  variant: mac
  vocab_size: 50000
  dim: 384
  depth: 5
  heads: 6
  ff_mult: 4
  segment_len: 512
  num_persist_mem_tokens: 0
  num_longterm_mem_tokens: 0

train:
  seq_len: 512
  batch_size: 6
  lr: 0.0005
  lr_min: 0.00005
  weight_decay: 0.01
  warmup_steps: 300
  max_steps: 4000
  grad_clip: 1.0
  betas: [0.9, 0.98]
  eps: 1.0e-8
  cosine_decay: true
  save_every: 1000
  eval_every: 500

data:
  # New S3-backed corpus (fineweb sample + stack-smol) and tokenizer
  train_path: s3://alix-ai-ml-staging-data/titan/data/processed/train.txt
  val_path: s3://alix-ai-ml-staging-data/titan/data/processed/val.txt
  tokenizer_path: s3://alix-ai-ml-staging-data/titan/tokenizers/new_bpe_50k/bpe_50k_fw_stack.model
  max_tokens: 50000000        # cap train tokens loaded
  max_tokens_val: 2000000     # cap val tokens loaded
  shuffle_buffer: 100000


