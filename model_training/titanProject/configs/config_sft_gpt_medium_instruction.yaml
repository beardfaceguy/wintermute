model:
  variant: gpt
  vocab_size: 50000
  dim: 1024
  depth: 24
  heads: 16
  ff_mult: 4
  max_seq_len: 2048

train:
  seq_len: 1024
  batch_size: 2
  grad_accum_steps: 8
  lr: 0.00005
  lr_min: 0.000005
  weight_decay: 0.01
  warmup_steps: 300
  max_steps: 5000
  grad_clip: 1.0
  betas: [0.9, 0.98]
  eps: 1.0e-8
  cosine_decay: true
  save_every: 1000
  eval_every: 500

data:
  train_path: s3://alix-ai-ml-staging-data/titan/data/sft_mix/train_sft_mix.txt
  val_path: s3://alix-ai-ml-staging-data/titan/data/sft_mix/val_sft_mix.txt
  tokenizer_path: s3://alix-ai-ml-staging-data/titan/tokenizers/new_bpe_50k/bpe_50k_fw_stack.model
  shuffle_buffer: 100000
