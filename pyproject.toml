[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "thVoice",                               # voice subsystem, pre-existing issues
    "openclaw", "mcp_aws", "titans-pytorch",
    "aws-doc-sdk-examples", ".venv", "venv",
    "model_training",                        # training scripts, not production code
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",   # line too long (ruff-format handles this)
    "B008",   # function calls in default args (FastAPI pattern)
    "E402",   # module-level import not at top (run_benchmark.py loads .env first intentionally)
]

[tool.ruff.lint.isort]
known-first-party = ["eval", "agents", "mcp_memory", "shared"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "talkingHead/backend/tests",
    "model_training/titanProject/tests",
    "thVoice/tests",
]
asyncio_mode = "auto"
markers = [
    "gpu: requires CUDA GPU",
    "slow: long-running tests",
    "integration: requires external services (DB, LLM, etc.)",
    "lifecycle: resource lifecycle / memory leak regression tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
