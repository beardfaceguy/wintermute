model:
  variant: mac
  vocab_size: 50000
  dim: 384
  depth: 5
  heads: 6
  ff_mult: 4
  segment_len: 256
  num_persist_mem_tokens: 4
  num_longterm_mem_tokens: 16
  # titans-pytorch 0.5.3 features ENABLED — this is the lookahead arm of
  # the A/B comparison vs config_mac_baseline_25k.yaml.
  store_with_lookahead_value: true
  neural_memory_add_value_residual: true
  neural_mem_gate_attn_output: true

train:
  seq_len: 512
  batch_size: 4
  lr: 0.0005
  lr_min: 0.00005
  weight_decay: 0.01
  warmup_steps: 300
  max_steps: 25000
  grad_clip: 1.0
  betas: [0.9, 0.98]
  eps: 1.0e-8
  cosine_decay: true
  # Lower-frequency eval/save cadence for the longer run — at the validation
  # run's ~90s per eval, 500-step cadence would burn 75 min of eval time.
  save_every: 5000
  eval_every: 2500

data:
  train_path: s3://alix-ai-ml-staging-data/titan/data/processed/train.txt
  val_path: s3://alix-ai-ml-staging-data/titan/data/processed/val.txt
  tokenizer_path: s3://alix-ai-ml-staging-data/titan/tokenizers/new_bpe_50k/bpe_50k_fw_stack.model
  max_tokens: 50000000
  max_tokens_val: 2000000
  shuffle_buffer: 100000
