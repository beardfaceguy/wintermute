model:
  variant: gpt
  vocab_size: 50000
  dim: 768
  depth: 12
  heads: 12
  ff_mult: 4
  max_seq_len: 2048

train:
  seq_len: 1024
  batch_size: 2
  grad_accum_steps: 32
  lr: 0.0003
  lr_min: 0.00003
  weight_decay: 0.1
  warmup_steps: 3000
  max_steps: 40000
  target_tokens: 2300000000
  grad_clip: 1.0
  betas: [0.9, 0.98]
  eps: 1.0e-8
  cosine_decay: true
  save_every: 2000
  eval_every: 2000

data:
  train_path: s3://alix-ai-ml-staging-data/titan/data/processed/train.txt
  val_path: s3://alix-ai-ml-staging-data/titan/data/processed/val.txt
  tokenizer_path: s3://alix-ai-ml-staging-data/titan/tokenizers/new_bpe_50k/bpe_50k_fw_stack.model
  max_tokens: 1000000000
  max_tokens_val: 5000000
  shuffle_buffer: 100000
